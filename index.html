<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>

</style>
<title>강릉·대관령 가족여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: quiet native-app shell — light type, weight only for titles and emphasis, one dark focus card, hairline list rows, fixed tab bar */
:root {
  --ground: #F5F6F8;
  --surface: #FFFFFF;
  --ink: #191F28;
  --ink-2: #333D4B;
  --sub: #6B7684;
  --faint: #8B95A1;
  --line: #E5E8EB;
  --divider: #F2F4F6;
  --seg: #ECEEF1;
  --accent: #3182F6;
  --accent-soft: #EEF4FE;
  --a: #3182F6;
  --b: #1B8754;
  --b-soft: #E9F6EF;
  --c: #C25A0E;
  --hot: #D9344F;
  --hot-soft: #FDEFF1;
  --hot-ink: #A1213A;
  --warn-soft: #FFF6EC;
  --warn-ink: #8A4508;
  --focus-bg: #1F2937;
  --focus-ink: #FFFFFF;
  --focus-sub: #C2CAD6;
  --font: "Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #101318; --surface: #1A1F27; --ink: #F2F4F6; --ink-2: #D1D6DB; --sub: #A2ABB6; --faint: #7E8894; --line: #2A313B; --divider: #232A33; --seg: #232A33;
    --accent: #5A9CFF; --accent-soft: #1B2A42; --a: #5A9CFF; --b: #4CC38A; --b-soft: #15302A; --c: #F2994A; --hot: #FF6B81; --hot-soft: #3A1A21; --hot-ink: #FFB3BF;
    --warn-soft: #33240F; --warn-ink: #F7C58C; --focus-bg: #263142; --focus-ink: #FFFFFF; --focus-sub: #B4C0D2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #101318; --surface: #1A1F27; --ink: #F2F4F6; --ink-2: #D1D6DB; --sub: #A2ABB6; --faint: #7E8894; --line: #2A313B; --divider: #232A33; --seg: #232A33;
  --accent: #5A9CFF; --accent-soft: #1B2A42; --a: #5A9CFF; --b: #4CC38A; --b-soft: #15302A; --c: #F2994A; --hot: #FF6B81; --hot-soft: #3A1A21; --hot-ink: #FFB3BF;
  --warn-soft: #33240F; --warn-ink: #F7C58C; --focus-bg: #263142; --focus-ink: #FFFFFF; --focus-sub: #B4C0D2;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--ground); }
body { color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.55; letter-spacing: -0.01em; font-weight: 400; word-break: keep-all; overflow-wrap: break-word; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
button { font: inherit; color: inherit; letter-spacing: inherit; }
b, strong { font-weight: 600; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { margin: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(88px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 12px; }
.view[hidden] { display: none !important; }

.hdr { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 0 4px 2px; }
.hdr .eb { font-size: 13px; font-weight: 500; color: var(--sub); }
h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.3; padding: 0 4px; }
.hdr h1 { padding: 0; }
.lead { margin: 2px 0 0; font-size: 14px; color: var(--sub); padding: 0 4px; }
.wxpill { flex: none; display: inline-flex; align-items: center; gap: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.wxpill svg { stroke: #F59E0B; width: 15px; height: 15px; }

.seg { display: grid; gap: 2px; background: var(--seg); border-radius: 12px; padding: 3px; }
.seg button { border: 0; border-radius: 10px; background: transparent; padding: 7px 0; font-size: 14px; font-weight: 500; color: var(--sub); cursor: pointer; min-height: 36px; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(25,31,40,.08); }
.seg.plan button[aria-selected="true"] { background: var(--pc); color: #fff; box-shadow: none; }

.card { background: var(--surface); border-radius: 16px; }
.pad { padding: 16px; }
.list { padding: 0 16px; }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 0; min-height: 48px; border-top: 1px solid var(--divider); }
.row:first-child { border-top: 0; }
.grp-t { font-size: 13px; font-weight: 500; color: var(--sub); padding: 6px 4px 0; margin-bottom: -4px; }

/* focus card */
.focus { display: flex; flex-direction: column; gap: 10px; background: var(--focus-bg); color: var(--focus-ink); border-radius: 18px; padding: 16px; cursor: pointer; border: 0; text-align: left; width: 100%; }
.focus .top { display: flex; align-items: center; gap: 8px; }
.tag { background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 8px; letter-spacing: 0; }
.focus .when { font-size: 13px; font-weight: 500; color: var(--focus-sub); }
.focus .ttl { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.02em; }
.focus .pl { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--focus-sub); }
.chip { flex: none; width: 20px; height: 20px; border-radius: 6px; color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; letter-spacing: 0; }
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
.act { display: flex; align-items: center; justify-content: center; gap: 6px; height: 42px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 600; text-decoration: none; border: 0; cursor: pointer; }
.act svg { width: 16px; height: 16px; }
.focus .act { background: rgba(255,255,255,.1); color: #fff; font-weight: 500; }

.next { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 0; width: 100%; text-align: left; cursor: pointer; }
.next .tx { flex: 1; min-width: 0; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.next .tx b { color: var(--ink); }
.next svg { color: var(--faint); width: 16px; height: 16px; }

details.route summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; font-weight: 600; font-size: 14px; }
details.route summary::-webkit-details-marker { display: none; }
details.route summary .r { font-weight: 400; color: var(--sub); font-size: 13px; display: flex; align-items: center; gap: 4px; }
details.route summary .r svg { width: 15px; height: 15px; }
details.route[open] summary .chev { transform: rotate(180deg); }
details.route .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: var(--ink-2); }
.stops { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.stops span { background: var(--ground); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
.stops i { font-style: normal; color: var(--faint); font-size: 11px; }
.note { font-size: 12px; color: var(--sub); line-height: 1.5; }

/* timeline */
.tl .row { align-items: flex-start; cursor: pointer; }
.tl .row.static { cursor: default; }
.tl .t { width: 44px; flex: none; font-size: 14px; font-weight: 500; color: var(--sub); padding-top: 1px; }
.tl .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 8px; background: var(--surface); border: 1.5px solid #C5CCD3; }
.tl .row.now .dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.tl .row.done .dot { background: #D1D6DB; border-color: #D1D6DB; }
.tl .tt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tl .tt b { font-size: 15px; font-weight: 400; line-height: 1.45; color: var(--ink); }
.tl .row.now .t, .tl .row.now .tt b { color: var(--accent); font-weight: 600; }
.tl .row.done .t, .tl .row.done .tt b { color: var(--faint); }
.tl .row.done .tt b { text-decoration: line-through; }
.tl .row svg.go { color: #C5CCD3; margin-top: 3px; width: 16px; height: 16px; }
.alt { align-self: flex-start; font-size: 12px; font-weight: 500; color: var(--b); background: var(--b-soft); border-radius: 5px; padding: 1px 6px; line-height: 1.5; }

/* detail */
.dtop { display: flex; align-items: center; justify-content: space-between; margin: -10px -10px 0; }
.back { width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.back svg { width: 22px; height: 22px; }
.dtop .w { font-size: 13px; font-weight: 500; color: var(--sub); }
.dtitle { font-size: 21px; font-weight: 700; line-height: 1.4; letter-spacing: -0.025em; margin: 0; padding: 0 4px; text-wrap: balance; }
.move { display: flex; gap: 6px; align-items: flex-start; font-size: 13px; color: var(--sub); margin-top: -4px; padding: 0 4px; }
.move svg { margin-top: 2px; width: 15px; height: 15px; }
.pcard { display: flex; flex-direction: column; gap: 12px; }
.pcard .rank { font-size: 12px; font-weight: 600; color: var(--pc); }
.pcard .nm { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.02em; }
.pcard .ad { font-size: 13px; color: var(--sub); margin-top: 2px; }
ul.bul { margin: 0; padding: 0 0 0 16px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.6; color: var(--ink-2); }
ul.bul li::marker { color: var(--faint); }
ul.bul b { font-weight: 600; color: var(--ink); }
.hot-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 2px; }
.hot-h b { font-size: 14px; color: var(--hot); font-weight: 600; }
.hot-h span { font-size: 12px; color: var(--sub); }
.hotrow { text-decoration: none; color: inherit; }
.hotrow .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.hotrow .tx b { font-size: 15px; font-weight: 500; }
.hotrow .tx span { font-size: 13px; color: var(--sub); line-height: 1.5; }
.hotrow svg { color: var(--accent); width: 16px; height: 16px; }
details.inf { border-top: 1px solid var(--divider); }
details.inf:first-child { border-top: 0; }
details.inf summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 13px 0; min-height: 48px; }
details.inf summary::-webkit-details-marker { display: none; }
details.inf summary .k { width: 56px; flex: none; font-size: 13px; font-weight: 500; color: var(--sub); }
details.inf summary .v { flex: 1; min-width: 0; font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
details.inf summary svg { color: var(--faint); width: 15px; height: 15px; transition: transform .2s; }
details.inf[open] summary .v { visibility: hidden; }
details.inf[open] summary svg { transform: rotate(180deg); }
details.inf .body { padding: 0 0 14px; }
details.inf ul.bul { font-size: 14px; }
.tel { color: var(--accent); white-space: nowrap; text-decoration: none; }
.mini { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 500; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 6px; padding: 0 6px; margin-left: 4px; text-decoration: none; cursor: pointer; vertical-align: 1px; line-height: 1.7; }

/* switch */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--sub); }
.legend i { width: 8px; height: 8px; border-radius: 2px; }
.sw { display: flex; flex-direction: column; gap: 8px; }
.sw .h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sw .h b { font-size: 16px; font-weight: 600; }
.sw .h span { font-size: 13px; color: var(--sub); }
.rule { background: var(--warn-soft); color: var(--warn-ink); border-radius: 10px; padding: 9px 12px; font-size: 13px; line-height: 1.55; }
.rule b { font-weight: 600; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 15px; line-height: 1.45; color: var(--ink-2); }
.opt .chip { width: 22px; height: 22px; border-radius: 6px; font-size: 11px; }

/* prep */
.ring { flex: none; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.ring div { width: 46px; height: 46px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; letter-spacing: 0; }
.chk { align-items: flex-start; }
.chk input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--b); flex: none; cursor: pointer; }
.chk .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; cursor: pointer; }
.chk .tx b { font-size: 15px; font-weight: 500; line-height: 1.45; }
.chk .tx span { font-size: 13px; color: var(--sub); }
.chk.done .tx b { color: var(--faint); text-decoration: line-through; }
.chk .more { flex: none; border: 0; background: none; width: 36px; height: 36px; margin: -7px -8px 0 0; display: flex; align-items: center; justify-content: center; color: var(--faint); cursor: pointer; }
.chk .more svg { width: 16px; height: 16px; }
.chk .more[aria-expanded="true"] svg { transform: rotate(180deg); }
.chk .ex { margin-top: 6px; font-size: 13px; color: var(--ink-2); background: var(--ground); border-radius: 10px; padding: 8px 10px; }
.chk .ex ul.bul { font-size: 13px; gap: 3px; }
.star { color: var(--hot); }
.reset { align-self: center; border: 0; background: none; color: var(--faint); font-size: 13px; text-decoration: underline; cursor: pointer; padding: 8px; }

/* info */
.kgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; background: var(--ground); border-radius: 12px; padding: 12px 14px; }
.kgrid div { display: flex; flex-direction: column; gap: 1px; }
.kgrid span { font-size: 12px; color: var(--sub); }
.kgrid b { font-size: 16px; font-weight: 600; }
.er { display: flex; align-items: center; gap: 12px; background: var(--hot-soft); color: var(--hot-ink); border-radius: 16px; padding: 14px 16px; text-decoration: none; }
.er .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--hot); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
.er .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.er b { font-size: 15px; font-weight: 600; }
.er span { font-size: 13px; }
.er svg.go { width: 16px; height: 16px; }
.wx .d { width: 44px; flex: none; display: flex; flex-direction: column; }
.wx .d b { font-size: 15px; font-weight: 600; }
.wx .d span, .wx .m span { font-size: 12px; color: var(--sub); }
.wx .m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.wx .m b { font-size: 14px; font-weight: 500; }
.wx .t { font-size: 15px; font-weight: 600; text-align: right; flex: none; }
.wx .row { align-items: flex-start; }
details.src summary { cursor: pointer; padding: 14px 16px; font-weight: 500; color: var(--sub); font-size: 13px; }
details.src ol { margin: 0; padding: 0 16px 16px 34px; font-size: 12px; color: var(--sub); }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-top: 6px; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--faint); font-size: 11px; font-weight: 500; min-height: 46px; cursor: pointer; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-selected="true"] { color: var(--ink); font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--ground); font-size: 13px; padding: 8px 14px; border-radius: 999px; z-index: 9; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; }
.toast.on { opacity: 1; }
.cols, .col, .grid2, .masonry, .grp { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (min-width: 720px) {
  .app { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); padding-top: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>


<div class="app">
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-detail" hidden></section>
  <section class="view" id="v-switch" hidden></section>
  <section class="view" id="v-prep" hidden></section>
  <section class="view" id="v-info" hidden></section>
</div>

<nav class="tabbar" aria-label="메뉴">
  <div class="in" role="tablist">
    <button type="button" data-tab="plan" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>일정</button>
    <button type="button" data-tab="switch" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>플랜 전환</button>
    <button type="button" data-tab="prep" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>준비</button>
    <button type="button" data-tab="info" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5L12 4l9 6.5V20H3z"/><path d="M9.5 20v-5h5v5"/></svg>숙소·정보</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const PL = [
  { k: 'A', tag: '추천', c: 'var(--a)' },
  { k: 'B', tag: '여유', c: 'var(--b)' },
  { k: 'C', tag: '대안', c: 'var(--c)' }
];
const IK = ['날씨', '위치', '시간·요금', '주차·동선', '하린이', '어머님'];
const QK = [['A', 'var(--a)'], ['B', 'var(--b)'], ['C', 'var(--c)'], ['★', 'var(--hot)']];
const S = (time, title, plans, star, info, aTag) => ({ time, title, plans, star, info, aTag });

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const split = s => s.split(' · ').map(x => { const m = x.match(/^\[([^\]]+)\]\s*(.*)$/); return m ? { h: m[1], t: m[2] } : { h: '', t: x }; });
const PHONE = /(0\d{1,3}-\d{3,4}-\d{4})/g;
const fmt = s => esc(s).replace(PHONE, p => `<a class="tel" href="tel:${p.replace(/-/g, '')}">${p}</a>`);
const norm = s => s.replace(/\(.*?\)/g, '').replace(/\s+/g, '');
const cleanName = h => h.replace(/^\d순위:\s*/, '').replace(/\s*\d{1,2}:\d{2}.*$/, '').trim();
const NOT_PLACE = /(시 |플랜|보호|원칙|순서|최우선|낮잠|방한|멘트|응급|물놀이|해변\]|목적지)/;

const mapUrl = (name, di) => 'https://map.naver.com/p/search/' + encodeURIComponent((/휴게소|IC|평창|강릉|주문진|대관령/.test(name) ? '' : regionOf(di) + ' ') + name.replace(/\(.*?\)/g, '').trim());

const startOf = t => (t.match(/\d{1,2}:\d{2}/) || [''])[0];
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const shortTitle = t => t.split(' (')[0];

function bullets(items, di, withMap) {
  return '<ul class="bul">' + items.map(it => `<li>${it.h ? `<b>${esc(it.h)}</b> ` : ''}${fmt(it.t)}${withMap && isPlace(it.h) ? mapBtn(cleanName(it.h), di) : ''}</li>`).join('') + '</ul>';
}
function findIn(text, name) {
  const n = norm(name);
  return split(text).find(e => e.h && (n.includes(norm(e.h)) || norm(e.h).includes(n))) || null;
}
function placeOf(slot, pi) {
  const text = slot.plans[pi];
  const first = split(text)[0];
  let rank = '', name = '';
  if (first.h) {
    rank = (first.h.match(/^(\d순위)/) || [])[1] || '';
    const parts = first.h.replace(/^\d순위:\s*/, '').split(' 또는 ');
    const hit = parts.find(x => isPlace(x));
    if (hit) name = cleanName(hit);
  }
  const fromHead = !!name;
  if (!name) {
    const fb = split(slot.info[1]).find(e => e.h && isPlace(e.h));
    if (fb) {
      const n = norm(fb.h.replace(/^강릉\s*/, ''));
      const hay = norm((pi === 0 ? slot.title : '') + text);
      if (hay.includes(n) || text.includes('[' + fb.h.split(' ').pop() + ']')) { name = cleanName(fb.h); rank = ''; }
    }
  }
  if (!name) return null;
  const loc = findIn(slot.info[1], name);
  const hrs = findIn(slot.info[2], name);
  const phone = loc && (loc.t.match(PHONE) || [])[0];
  const addr = loc ? loc.t.replace(/\s*\((0\d[\d-]+)\)/, '').trim() : '';
  return { rank, name, phone, addr, hrs: hrs ? hrs.t : '', fromHead };
}

const store = {
  get(k, d) { try { const v = localStorage.getItem('gn-trip:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gn-trip:' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- time (KST) ---------- */
function kstNow() { const d = new Date(Date.now() + 9 * 3600e3); return { ymd: d.toISOString().slice(0, 10), min: d.getUTCHours() * 60 + d.getUTCMinutes() }; }
const now = kstNow();
const todayIdx = DAYS.findIndex(d => d.ymd === now.ymd);
const tripDiff = Math.round((Date.parse(now.ymd) - Date.parse('2026-10-22')) / 864e5);
function ranges(day) {
  return day.slots.map((s, j) => {
    const start = toMin(startOf(s.time));
    const next = day.slots[j + 1];
    const ts = s.time.match(/\d{1,2}:\d{2}/g);
    const end = next ? toMin(startOf(next.time)) : (/사이/.test(s.time) ? 21 * 60 : toMin(ts[1] || ts[0]));
    return [start, end];
  });
}

  tab: store.get('tab', 'plan'),

  prepSeg: store.get('prepSeg', 'check'),
  open: {},
  slot: null
};
const planOf = (di, j) => state.plan[di + '-' + j] ?? 0;

/* ---------- 일정 ---------- */
function renderPlan() {
  const di = state.day, d = DAYS[di], mv = MOVES[d.label], w = WEATHER[di];
  const R = ranges(d);
  const isToday = di === todayIdx;
  let focus = 0, label = '첫 일정';
  if (isToday) {
    const n = R.findIndex(([a, b]) => now.min >= a && now.min < b);
    if (n >= 0) { focus = n; label = '지금'; }
    else if (now.min < R[0][0]) { focus = 0; label = '곧 시작'; }
    else { focus = -1; }
  } else if (di === 0 && tripDiff === -1) label = '내일 첫 일정';
  const status = t => { if (!isToday || !t) return ''; const m = toMin(t); const j = R.findIndex(([a, b]) => m >= a && m < b); const [a, b] = j >= 0 ? R[j] : [m, m + 60]; return now.min >= b ? 'done' : now.min >= a ? 'now' : ''; };

  const temp = (w[1].match(/낮 ([\d~]+)℃/) || [])[1];
  const eyebrow = `${d.date}${isToday ? ` · 여행 ${di + 1}일차` : (di === 0 && tripDiff === -1 ? ' · 내일 출발' : '')}`;
  let h = `<div class="hdr"><div style="min-width:0"><div class="eb">${esc(eyebrow)}</div><h1>${isToday ? '오늘 일정' : `${di + 1}일차 일정`}</h1></div>

  h += '<div class="cols"><div class="col">';
  if (focus >= 0) {
    const s = d.slots[focus], pi = planOf(di, focus), p = placeOf(s, pi);
    const firstT = split(s.plans[pi])[0].t; const sub = p ? p.name : (firstT.length > 34 ? firstT.slice(0, 33) + '…' : firstT);
    h += `<div class="focus" role="button" tabindex="0" data-open="${focus}">
      <div class="top"><span class="tag">${label}</span><span class="when">${esc(s.time.replace(' ~ ', ' – '))}</span></div>
      <div class="ttl">${esc(shortTitle(s.title))}</div>
      <div class="pl"><span class="chip" style="background:${PL[pi].c}">${PL[pi].k}</span><span>${esc(sub)}</span></div>
      ${p ? `<div class="acts"><a class="act" href="${mapUrl(p.name, di)}" target="_blank" rel="noopener">${IC.pin}지도</a>${p.phone ? `<a class="act" href="tel:${p.phone.replace(/-/g, '')}">${IC.phone}전화</a>` : ''}</div>` : ''}

    const nx = d.slots[focus + 1];
    if (nx) {
      const lg = mv.legs[focus + 1] || ['', '']; const leg = /→/.test(lg[0]) ? lg[1].split(' · ')[0] : '';
      h += `<button type="button" class="next" data-open="${focus + 1}">${IC.car}<span class="tx"><b>다음 ${esc(startOf(nx.time))}</b> ${esc(shortTitle(nx.title))}${leg ? ` · ${esc(leg)}` : ''}</span>${IC.right}</button>`;

  const starts = d.slots.map(s => startOf(s.time));
  h += `<div class="card list tl">${d.overview.map(([t, title, wx, alt]) => {
    const st = startOf(t), j = starts.indexOf(st), cls = status(st);

/* ---------- 준비 ---------- */
function checkGroup(when) {
  if (/1일차/.test(when)) return '1일차 당일';
  if (/2일차/.test(when)) return '2일차 당일';
  if (/3일차/.test(when)) return '3일차 당일';
  if (/10\/21|전날/.test(when)) return '오늘 밤까지';
  return '출발 전';
}
function renderPrep() {
  const ck = state.checks, seg = state.prepSeg;
  const cKeys = CHECK.map((_, i) => 'c' + i);
  const pKeys = []; PACK.forEach((g, gi) => g[1].forEach((_, ii) => pKeys.push('p' + gi + '-' + ii)));
  const keys = seg === 'check' ? cKeys : pKeys;
  const done = keys.filter(k => ck[k]).length, pct = Math.round(done / keys.length * 100);
  const left = keys.length - done;
  let h = `<h1>준비</h1>
    <div class="card pad" style="display:flex;align-items:center;gap:16px">
      <div class="ring" style="background:conic-gradient(var(--b) 0 ${pct}%, var(--seg) ${pct}% 100%)"><div>${done}/${keys.length}</div></div>
      <div><div style="font-size:15px;font-weight:600">${left ? `${seg === 'check' ? '예약·확인' : '준비물'} ${left}개 남음` : '모두 끝났어요'}</div>
      <div style="font-size:13px;color:var(--sub)">체크 표시는 이 폰에만 저장돼요</div></div>
    </div>
    <div class="seg" role="tablist" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      <button type="button" role="tab" data-seg="check" aria-selected="${seg === 'check'}">예약·확인</button>
      <button type="button" role="tab" data-seg="pack" aria-selected="${seg === 'pack'}">준비물</button>
    </div><div class="masonry">`;
  if (seg === 'check') {
    const order = ['오늘 밤까지', '출발 전', '1일차 당일', '2일차 당일', '3일차 당일'];
    const groups = {};
    CHECK.forEach((c, i) => { const g = checkGroup(c[2]); (groups[g] = groups[g] || []).push(i); });
    order.filter(g => groups[g]).forEach(g => {
      h += `<div class="grp"><div class="grp-t">${g}</div><div class="card list">${groups[g].map(i => {
        const [title, cat, when, txt, note, who] = CHECK[i], k = 'c' + i, on = !!ck[k], ex = !!state.open[k], star = title.startsWith('★ ');
        return `<div class="row chk ${on ? 'done' : ''}"><input type="checkbox" id="${k}" data-ck="${k}" ${on ? 'checked' : ''}>
          <label class="tx" for="${k}"><b>${star ? '<span class="star">★</span> ' : ''}${esc(star ? title.slice(2) : title)}</b><span>${esc(when)} · ${esc(who)}</span>
          ${ex ? `<div class="ex">${bullets(split(txt), 0, false)}<div style="margin-top:4px;color:var(--sub)">${fmt(note)}</div></div>` : ''}</label>
          <button type="button" class="more" data-ex="${k}" aria-expanded="${ex}" aria-label="자세히">${IC.down}</button></div>`;
      }).join('')}</div></div>`;
    });
  } else {
    PACK.forEach(([name, items], gi) => {
      h += `<div class="grp"><div class="grp-t">${name.startsWith('★') ? '<span class="star">★</span>' + esc(name.slice(1)) : esc(name)}</div><div class="card list">${items.map(([n, m, w], ii) => {
        const k = 'p' + gi + '-' + ii, on = !!ck[k];
        return `<div class="row chk ${on ? 'done' : ''}"><input type="checkbox" id="${k}" data-ck="${k}" ${on ? 'checked' : ''}>
          <label class="tx" for="${k}"><b>${n.startsWith('★') ? '<span class="star">★</span>' + esc(n.slice(1)) : esc(n)}</b><span>${[m, w].filter(Boolean).map(fmt).join(' · ')}</span></label></div>`;
      }).join('')}</div></div>`;
    });
  }
  h += `</div><button type="button" class="reset" id="resetChecks">체크 모두 지우기</button>`;
  document.getElementById('v-prep').innerHTML = h;
}

/* ---------- shell ---------- */
function show(view) {
  ['plan', 'detail', 'switch', 'prep', 'info'].forEach(v => document.getElementById('v-' + v).hidden = v !== view);
  const tab = view === 'detail' ? 'plan' : view;
  document.querySelectorAll('.tabbar button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
}
function goTab(t) { state.tab = t; store.set('tab', t); state.slot = null; show(t); window.scrollTo(0, 0); }
let savedY = 0;
function openSlot(j) {
  savedY = window.scrollY; state.slot = j; renderDetail(); show('detail'); window.scrollTo(0, 0);
  try { history.pushState({ slot: j }, ''); } catch (e) {}
}
function closeSlot(fromPop) {
  if (state.slot == null) return;
  state.slot = null; renderPlan(); show('plan'); window.scrollTo(0, savedY);
  if (!fromPop) { try { history.back(); } catch (e) {} }
}
window.addEventListener('popstate', () => { if (state.slot != null) closeSlot(true); });

let toastT;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1600); }

document.addEventListener('click', e => {
  if (e.target.closest('a[href]')) return;
  const t = e.target.closest('[data-tab],[data-day],[data-open],[data-back],[data-p],[data-seg],[data-copy],[data-ex],#resetChecks');
  if (!t) return;
  if (t.dataset.tab) return goTab(t.dataset.tab);
  if (t.dataset.day) { state.day = +t.dataset.day; store.set('day', state.day); renderPlan(); return; }
  if (t.dataset.open) return openSlot(+t.dataset.open);
  if (t.hasAttribute('data-back')) return closeSlot(false);
  if (t.dataset.p) { state.plan[state.day + '-' + state.slot] = +t.dataset.p; store.set('plan', state.plan); const y = window.scrollY; renderDetail(); window.scrollTo(0, y); return; }
  if (t.dataset.seg) { state.prepSeg = t.dataset.seg; store.set('prepSeg', t.dataset.seg); renderPrep(); return; }
  if (t.dataset.ex) { state.open[t.dataset.ex] = !state.open[t.dataset.ex]; const y = window.scrollY; renderPrep(); window.scrollTo(0, y); return; }
  if (t.dataset.copy) {
    const v = t.dataset.copy;
    try { navigator.clipboard.writeText(v).then(() => toast('복사했어요'), () => toast('길게 눌러 복사하세요')); } catch (err) { toast('길게 눌러 복사하세요'); }
    return;
  }
  if (t.id === 'resetChecks') { state.checks = {}; store.set('checks', {}); renderPrep(); toast('체크를 모두 지웠어요'); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.open) { e.preventDefault(); openSlot(+e.target.dataset.open); }
});
document.addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.key) state.open[e.target.dataset.key] = e.target.open; }, true);
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.ck; if (!k) return;
  if (e.target.checked) state.checks[k] = 1; else delete state.checks[k];
  store.set('checks', state.checks);
  const y = window.scrollY; renderPrep(); window.scrollTo(0, y);
});

renderPlan(); renderSwitch(); renderPrep(); renderInfo();
show(state.tab === 'detail' ? 'plan' : state.tab);
</script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
</body>
