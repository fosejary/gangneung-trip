<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f73">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="강릉여행">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>강릉·대관령 가족여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone app shell — sticky header, day switcher, timeline + slot cards, fixed bottom tab bar */
:root {
  --bg: #eaf0ef;
  --surface: #ffffff;
  --surface-2: #f3f7f6;
  --ink: #16262b;
  --muted: #5b6a6d;
  --line: #d6e0df;
  --sea: #1f5f73;
  --pine: #4b6640;
  --clay: #8f5523;
  --hot: #9a3a30;
  --wx: #3d6478;
  --now: #c2410c;
  --f-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1618; --surface: #162125; --surface-2: #1c292d; --ink: #e2ebeb; --muted: #97a8aa;
    --line: #29393d; --sea: #72b6ca; --pine: #9dc28a; --clay: #dba36f; --hot: #e48d80; --wx: #92b7cb; --now: #fb923c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1618; --surface: #162125; --surface-2: #1c292d; --ink: #e2ebeb; --muted: #97a8aa;
  --line: #29393d; --sea: #72b6ca; --pine: #9dc28a; --clay: #dba36f; --hot: #e48d80; --wx: #92b7cb; --now: #fb923c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sea); }
button { font: inherit; color: inherit; }
a { color: var(--sea); }
:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; border-radius: 6px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sea); color: #fff; }
.top-in { padding-block: 12px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font-family: var(--f-display); font-size: 19px; line-height: 1.25; letter-spacing: -0.01em; }
.top .sub { font-size: 12px; opacity: .82; letter-spacing: .02em; }
.dchip { flex: none; font-family: var(--f-mono); font-size: 13px; font-weight: 600; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); padding: 4px 10px; border-radius: 999px; }
.dayseg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding-block: 0 12px; }
.dayseg button { border: 0; background: rgba(255,255,255,.12); color: #fff; border-radius: 12px; padding: 7px 4px; cursor: pointer; line-height: 1.25; }
.dayseg button b { display: block; font-family: var(--f-mono); font-size: 13px; letter-spacing: .04em; }
.dayseg button span { font-size: 12px; opacity: .85; }
.dayseg button[aria-selected="true"] { background: #fff; color: #1f5f73; }
.dayseg button[aria-selected="true"] span { opacity: 1; }

main { padding-block: 16px calc(84px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.view[hidden] { display: none !important; }
.view { display: grid; gap: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; min-width: 0; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
h2 { font-family: var(--f-display); font-size: 21px; margin: 2px 0 6px; line-height: 1.3; text-wrap: balance; }
h3 { font-size: 16.5px; margin: 0; line-height: 1.4; text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* day head */
.wxline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); }
.pill.wx { color: var(--wx); border-color: color-mix(in srgb, var(--wx) 30%, var(--line)); background: color-mix(in srgb, var(--wx) 8%, var(--surface)); }
.route { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 8px; font-weight: 500; }
.route .arr { color: var(--muted); font-size: 12px; }
.route .stop { background: var(--surface-2); border-radius: 8px; padding: 2px 8px; font-size: 13.5px; }

/* overview timeline */
.tl { list-style: none; margin: 8px 0 0; padding: 0; display: grid; }
.tl li { display: grid; grid-template-columns: 88px 1fr; gap: 10px; padding: 9px 0; border-top: 1px dashed var(--line); cursor: pointer; }
.tl li:first-child { border-top: 0; }
.tl li.nolink { cursor: default; }
.tl .t { font-family: var(--f-mono); font-size: 12.5px; color: var(--sea); padding-top: 2px; font-variant-numeric: tabular-nums; }
.tl .ti { font-weight: 600; font-size: 14.5px; line-height: 1.45; }
.tl .w { font-size: 12.5px; color: var(--wx); }
.alt { display: inline-block; margin-top: 4px; font-size: 12px; line-height: 1.45; color: var(--pine); background: color-mix(in srgb, var(--pine) 11%, var(--surface)); border: 1px solid color-mix(in srgb, var(--pine) 30%, var(--line)); border-radius: 8px; padding: 2px 8px; }
.tl li.is-now .t, .tl li.is-now .ti { color: var(--now); }

/* slot */
.slot { scroll-margin-top: 140px; padding: 0; overflow: hidden; }
.slot.is-now { border-color: var(--now); box-shadow: 0 0 0 1px var(--now); }
.slot-h { padding: 14px 16px 10px; display: grid; gap: 4px; }
.slot-time { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 13px; color: var(--sea); font-weight: 600; font-variant-numeric: tabular-nums; }
.nowtag { font-family: var(--f-body); font-size: 11px; font-weight: 700; color: #fff; background: var(--now); padding: 1px 7px; border-radius: 999px; letter-spacing: .04em; }
.move { margin: 0 16px; padding: 7px 10px; border-radius: 10px; background: var(--surface-2); font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; }
.move b { color: var(--ink); font-weight: 600; }
.ptabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 12px 16px 0; }
.ptab { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 4px; cursor: pointer; font-size: 13px; line-height: 1.2; display: flex; align-items: center; justify-content: center; gap: 6px; }
.ptab .k { font-family: var(--f-mono); font-weight: 600; }
.ptab[aria-selected="true"] { background: var(--pc); border-color: var(--pc); color: var(--surface); }
.pbody { margin: 8px 16px 0; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--pc) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--pc) 25%, var(--line)); }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.items li { position: relative; padding-left: 12px; font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; }
.items li::before { content: ""; position: absolute; left: 0; top: .72em; width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .45; }
.items b { font-weight: 600; }
.pbody .items b { color: var(--pc); }
.hot { margin: 8px 16px 0; padding: 10px 12px; border-radius: 12px; border: 1px dashed color-mix(in srgb, var(--hot) 45%, var(--line)); }
.hot .lbl { font-size: 12.5px; font-weight: 700; color: var(--hot); margin-bottom: 4px; }
.hot .items b { color: var(--hot); }
.wxbox { margin: 8px 16px 0; font-size: 13px; color: var(--wx); display: flex; gap: 6px; }
details.more { margin: 10px 0 0; border-top: 1px solid var(--line); }
details.more summary { list-style: none; cursor: pointer; padding: 11px 16px; font-size: 13.5px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "펼치기"; font-size: 12px; font-weight: 500; }
details.more[open] summary::after { content: "접기"; }
.info { padding: 0 16px 14px; display: grid; gap: 12px; }
.info section { display: grid; gap: 4px; min-width: 0; }
.info h4 { margin: 0; font-size: 12px; letter-spacing: .06em; color: var(--ic); font-weight: 700; }
.info .items li { font-size: 13.5px; }
.maplink, .copy { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 0 7px; margin-left: 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--sea); text-decoration: none; line-height: 1.7; vertical-align: 1px; cursor: pointer; }
.tel { font-family: var(--f-mono); font-size: .94em; color: var(--sea); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; }

/* quick */
.qrow { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.qrow:first-of-type { border-top: 0; }
.qk { font-size: 12px; font-weight: 700; color: var(--qc); padding-top: 2px; }
.rule { margin-top: 8px; font-size: 13px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.rule b { color: var(--clay); }

/* prep */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: transparent; padding: 8px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--sea); color: var(--surface); }
.prog { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pine); transition: width .25s; }
.chk { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.chk:first-child { border-top: 0; }
.chk input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--pine); }
.chk .ttl { font-weight: 600; font-size: 15px; }
.chk.done .ttl { text-decoration: line-through; color: var(--muted); }
.chk .meta { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 6px; }
.chk .note { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.star { color: var(--hot); }
.pk { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: start; font-size: 14.5px; }
.pk:first-of-type { border-top: 0; }
.pk input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--pine); }
.pk.done .n { text-decoration: line-through; color: var(--muted); }
.pk .m { font-size: 12.5px; color: var(--muted); }
.pk .w { font-size: 11.5px; color: var(--sea); text-align: right; max-width: 110px; line-height: 1.4; padding-top: 3px; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--muted); justify-self: end; }

/* info */
.kv { display: grid; gap: 2px; padding: 8px 0; border-top: 1px dashed var(--line); }
.kv:first-of-type { border-top: 0; }
.kv .k { font-size: 12px; color: var(--muted); font-weight: 600; }
.wxday { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.wxday:first-of-type { border-top: 0; }
.wxday .d { font-weight: 700; font-family: var(--f-mono); color: var(--wx); }
.legend { display: grid; gap: 6px; font-size: 14px; }
.legend span b { font-family: var(--f-mono); margin-right: 6px; }
.alert { border-color: color-mix(in srgb, var(--hot) 40%, var(--line)); background: color-mix(in srgb, var(--hot) 6%, var(--surface)); }
.alert h3 { color: var(--hot); }
ol.src { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--muted); }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { border: 0; background: none; padding: 8px 0 9px; cursor: pointer; display: grid; justify-items: center; gap: 2px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.tabbar svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-selected="true"] { color: var(--sea); }

.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 13px; padding: 7px 14px; border-radius: 999px; z-index: 9; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="gut">
      <div class="top-in">
        <div style="min-width:0">
          <h1>강릉·대관령 가족여행</h1>
          <div class="sub">10.22 목 – 10.24 토 · 2박 3일 · v3</div>
        </div>
        <div class="dchip" id="dchip">D-1</div>
      </div>
      <div class="dayseg" id="dayseg" role="tablist" aria-label="일차 선택"></div>
    </div>
  </header>

  <main class="gut" id="main">
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-quick" hidden></section>
    <section class="view" id="v-prep" hidden></section>
    <section class="view" id="v-info" hidden></section>
  </main>
</div>

<nav class="tabbar" aria-label="메뉴">
  <div class="tabbar-in" role="tablist">
    <button data-tab="plan" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>일정</button>
    <button data-tab="quick" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M7 4v16M17 4v16M4 8h6M14 15h6"/></svg>플랜 전환</button>
    <button data-tab="prep" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/><path d="M4 20h16" opacity=".5"/></svg>준비</button>
    <button data-tab="info" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>정보</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const PL = [
  { k: 'A', tag: '추천', c: 'var(--sea)' },
  { k: 'B', tag: '여유', c: 'var(--pine)' },
  { k: 'C', tag: '대안', c: 'var(--clay)' }
];
const IK = [['날씨', 'var(--wx)'], ['위치·연락처', 'var(--muted)'], ['시간·요금', 'var(--muted)'], ['주차·동선', 'var(--muted)'], ['아이', 'var(--sea)'], ['어머님', 'var(--clay)']];
const S = (time, title, plans, star, info, aTag) => ({ time, title, plans, star, info, aTag });

const WEATHER = [
  ['10/22 (목)', '아침 4~7℃ / 낮 14~16℃', '아침 -3~-1℃ / 낮 11~13℃', '맑음. 동해안 강풍특보 가능, 너울', '바비큐 실내 전환, 해안도로 드라이브 제외, 출발 전 성에 제거'],
  ['10/23 (금)', '전국 아침 3~15℃ / 낮 18~22℃', '아침까지 평년보다 2~6℃ 낮음', '가끔 구름, 동해 파고 0.5~1.5m', '3일 중 최적 → 해변·카페 유지, 숙소 앞 압축 동선 추가'],
  ['10/24 (토)', '전국 아침 8~17℃ / 낮 18~21℃', '강릉보다 4~6℃ 낮음, 낮 10℃대 중반', '중부 구름많음, 비 없음', '트랙터마차 담요·핫팩, 출발 20분 앞당김 고려']
];

const DAYS = [
{ label: 'DAY 1', ymd: '2026-10-22', short: '10/22 목', date: '10월 22일 목요일',
intro: '맑지만 3일 중 가장 춥고 바람이 강한 날이라, 바깥에 오래 서 있는 구간을 실내로 옮겼습니다. 하린이 기상(08:00)에 맞춰 출발을 09:30으로 늦추고 오후 일정을 뒤로 밀었습니다.',
overview: [
['08:00–09:30', '하린이 기상 · 아침 식사 · 짐 싣기', '출발 전 성에 확인'],
['09:30–12:50', '양주 출발 → 강릉 이동 (힐링 전망 휴게소 경유)', '오전 내륙 한 자릿수 기온'],
['13:00–14:15', '초당순두부마을 미식 점심 & 솔숲 정원 산책', '솔숲이 바람막이'],
['14:30–15:30', '강릉중앙시장 & 월화거리 + 꼬막비빔밥 포장', '야외 산책 짧게'],
['16:00–17:50', '치즈바다 풀빌라 체크인 & 실내 온수풀·족욕', '테라스 최소화', 'B: 30분 휴식 후 16:30~17:20 물놀이'],
['18:00~19:00 사이', '실내 그릴 만찬 & 중앙시장·엄지네 포장 미식', '저녁 10℃ 안팎 + 바람']],
slots: [
S('09:30 ~ 12:50', '양주 출발 → 강릉 이동 (힐링 전망 휴게소 경유)', [

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const split = s => s.split(' · ').map(x => { const m = x.match(/^\[([^\]]+)\]\s*(.*)$/); return m ? { h: m[1], t: m[2] } : { h: '', t: x }; });
const PHONE = /(0\d{1,3}-\d{3,4}-\d{4})/g;
const fmt = s => esc(s).replace(PHONE, p => `<a class="tel" href="tel:${p.replace(/-/g, '')}">${p}</a><button class="copy" data-copy="${p}" type="button">복사</button>`);
const mapUrl = (name, region) => 'https://map.naver.com/p/search/' + encodeURIComponent((/휴게소|IC/.test(name) ? '' : region + ' ') + name.replace(/\(.*?\)/g, '').replace(/^(1|2|3)순위:\s*/, '').trim());
function itemsHtml(list, opt = {}) {
  return '<ul class="items">' + list.map(it => {
    const map = opt.map && it.h && !/응급|핵심|절대|최우선|낮잠|방한|스위스램 주문/.test(it.h) ? `<a class="maplink" href="${mapUrl(it.h, opt.region)}" target="_blank" rel="noopener">지도</a>` : '';
    return `<li>${it.h ? `<b>${esc(it.h)}</b> ` : ''}${fmt(it.t)}${map}</li>`;
  }).join('') + '</ul>';
}

const store = {
  get(k, d) { try { const v = localStorage.getItem('gn-trip:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

};

/* ---------- time (KST) ---------- */
function kstNow() { const d = new Date(Date.now() + 9 * 3600e3); return { ymd: d.toISOString().slice(0, 10), min: d.getUTCHours() * 60 + d.getUTCMinutes() }; }
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
function slotRanges(day) {
  return day.slots.map((s, j) => {
    const ts = s.time.match(/\d{1,2}:\d{2}/g) || [];
    const start = toMin(ts[0]);
    const next = day.slots[j + 1];
    let end = next ? toMin(next.time.match(/\d{1,2}:\d{2}/)[0]) : (/사이/.test(s.time) ? 21 * 60 : toMin(ts[1] || ts[0]));
    if (!next && /사이/.test(s.time)) end = 21 * 60;
    return [start, end];
  });
}

  prepSeg: store.get('prepSeg', 'check')
};

function dChip() {
  const start = Date.UTC(2026, 9, 22), t = Date.UTC(...now.ymd.split('-').map((v, i) => i === 1 ? v - 1 : +v));
  const diff = Math.round((t - start) / 864e5);
  if (diff < 0) return diff === -1 ? '내일 출발' : 'D' + diff;
  if (diff <= 2) return `여행 ${diff + 1}일차`;
  return '여행 완료';
}

      return `<li class="${cls}" ${j >= 0 ? `data-goto="${j}" tabindex="0" role="button"` : ''}>
        <div class="t">${esc(t)}</div>
        <div style="min-width:0"><div class="ti">${esc(title)}</div><div class="w">${esc(wx)}</div>${alt ? `<span class="alt">플랜별 시간 · ${esc(alt)}</span>` : ''}</div>
      </li>`; }).join('')}</ol>
  </div>`;

  const region = state.day === 2 ? '평창 대관령' : '강릉';
  d.slots.forEach((s, j) => {
    const key = state.day + '-' + j;
    const pi = state.plan[key] ?? 0;
    const p = PL[pi];
    const leg = mv.legs[j] || ['', ''];
    const stars = s.star ? (Array.isArray(s.star[0]) ? s.star : [s.star]) : [];
    h += `<article class="card slot ${j === nowSlot ? 'is-now' : ''}" id="slot-${j}">
      <div class="slot-h">
        <div class="slot-time">${esc(s.time)}${j === nowSlot ? '<span class="nowtag">지금</span>' : ''}</div>
        <h3>${esc(s.title)}</h3>
      </div>
      ${leg[0] ? `<div class="move"><span aria-hidden="true">🚗</span><span><b>${esc(leg[0])}</b> · ${esc(leg[1])}</span></div>` : ''}
      <div class="ptabs" role="tablist">${PL.map((q, i) => `<button type="button" class="ptab" role="tab" data-key="${key}" data-p="${i}" aria-selected="${i === pi}" style="--pc:${q.c}"><span class="k">${q.k}</span>${esc(i === 0 && s.aTag ? s.aTag : q.tag)}</button>`).join('')}</div>
      <div class="pbody" style="--pc:${p.c}">${itemsHtml(split(s.plans[pi]))}</div>
      ${stars.map(([label, t]) => `<div class="hot"><div class="lbl">${esc(label)}</div>${itemsHtml(split(t))}</div>`).join('')}
      <div class="wxbox"><span aria-hidden="true">☁︎</span><span>${esc(s.info[0])}</span></div>
      <details class="more"><summary>위치·시간·주차·아이·어머님</summary>
        <div class="info">${s.info.slice(1).map((t, i) => `<section style="--ic:${IK[i + 1][1]}"><h4>${IK[i + 1][0]}</h4>${itemsHtml(split(t), { map: i === 0, region })}</section>`).join('')}</div>
      </details>
    </article>`;
  });
  document.getElementById('v-plan').innerHTML = h;
}

/* ---------- render: prep ---------- */
function renderPrep() {
  const ck = state.checks;
  const totalC = CHECK.length, doneC = CHECK.filter((_, i) => ck['c' + i]).length;
  const packKeys = []; PACK.forEach((g, gi) => g[1].forEach((_, ii) => packKeys.push('p' + gi + '-' + ii)));
  const doneP = packKeys.filter(k => ck[k]).length;
  const seg = state.prepSeg;
  let h = `<div class="seg" role="tablist">
      <button type="button" data-seg="check" aria-selected="${seg === 'check'}">예약·확인 ${doneC}/${totalC}</button>
      <button type="button" data-seg="pack" aria-selected="${seg === 'pack'}">준비물 ${doneP}/${packKeys.length}</button>
    </div>`;
  if (seg === 'check') {
    h += `<div class="card"><div class="prog"><div class="bar"><i style="width:${doneC / totalC * 100}%"></i></div><span class="mono">${doneC}/${totalC}</span></div>
      <p class="small muted" style="margin:8px 0 0">★는 날씨·핫플 반영으로 새로 생긴 항목이에요. 체크 표시는 이 폰에만 저장돼요.</p></div>
      <div class="card">${CHECK.map(([title, cat, when, txt, note, who], i) => {
        const star = title.startsWith('★ ');
        const on = !!ck['c' + i];
        return `<label class="chk ${on ? 'done' : ''}"><input type="checkbox" id="c${i}" data-ck="c${i}" ${on ? 'checked' : ''}>
          <div style="min-width:0"><div class="ttl">${star ? '<span class="star">★</span> ' : ''}${esc(star ? title.slice(2) : title)}</div>
          <div class="meta"><span class="pill">${esc(cat)}</span><span class="pill wx">${esc(when)}</span><span class="pill">담당 · ${esc(who)}</span></div>
          ${itemsHtml(split(txt))}<div class="note">${fmt(note)}</div></div></label>`; }).join('')}</div>`;
  } else {
    h += `<div class="card"><div class="prog"><div class="bar"><i style="width:${doneP / packKeys.length * 100}%"></i></div><span class="mono">${doneP}/${packKeys.length}</span></div></div>`;
    h += PACK.map(([name, items], gi) => `<div class="card"><h3 style="margin-bottom:4px">${name.startsWith('★') ? '<span class="star">★</span>' + esc(name.slice(1)) : esc(name)}</h3>
      ${items.map(([n, m, w], ii) => { const k = 'p' + gi + '-' + ii, on = !!ck[k]; return `<label class="pk ${on ? 'done' : ''}"><input type="checkbox" id="${k}" data-ck="${k}" ${on ? 'checked' : ''}>
        <div style="min-width:0"><div class="n">${n.startsWith('★') ? '<span class="star">★</span>' + esc(n.slice(1)) : esc(n)}</div>${m ? `<div class="m">${fmt(m)}</div>` : ''}</div><div class="w">${esc(w)}</div></label>`; }).join('')}</div>`).join('');
  }
  h += `<button type="button" class="ghost" id="resetChecks">체크 모두 지우기</button>`;
  document.getElementById('v-prep').innerHTML = h;
}

/* ---------- shell ---------- */
function showTab(t, scroll = true) {
  state.tab = t; store.set('tab', t);
  document.querySelectorAll('.tabbar button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  ['plan', 'quick', 'prep', 'info'].forEach(v => document.getElementById('v-' + v).hidden = v !== t);
  document.getElementById('dayseg').hidden = t !== 'plan';
  if (scroll) window.scrollTo(0, 0);
}
function renderAll() { renderDaySeg(); renderPlan(); renderQuick(); renderPrep(); renderInfo(); showTab(state.tab, false); }

let toastT;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1600); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-day],[data-p],[data-goto],[data-seg],[data-copy],#resetChecks');
  if (!t) return;
  if (t.dataset.tab) return showTab(t.dataset.tab);
  if (t.dataset.day) { state.day = +t.dataset.day; store.set('day', state.day); renderDaySeg(); renderPlan(); window.scrollTo(0, 0); return; }
  if (t.dataset.p) { state.plan[t.dataset.key] = +t.dataset.p; store.set('plan', state.plan); const y = window.scrollY; renderPlan(); window.scrollTo(0, y); return; }
  if (t.dataset.goto) { document.getElementById('slot-' + t.dataset.goto)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.seg) { state.prepSeg = t.dataset.seg; store.set('prepSeg', t.dataset.seg); renderPrep(); return; }
  if (t.dataset.copy) {
    e.preventDefault();
    const v = t.dataset.copy;
    try { navigator.clipboard.writeText(v).then(() => toast(v + ' 복사했어요'), () => toast('길게 눌러 번호를 복사하세요')); } catch (err) { toast('길게 눌러 번호를 복사하세요'); }
    return;
  }
  if (t.id === 'resetChecks') { state.checks = {}; store.set('checks', {}); renderPrep(); toast('체크를 모두 지웠어요'); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.goto) { e.preventDefault(); e.target.click(); } });
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.ck; if (!k) return;
  if (e.target.checked) state.checks[k] = 1; else delete state.checks[k];
  store.set('checks', state.checks);
  const y = window.scrollY; renderPrep(); window.scrollTo(0, y);
});

document.getElementById('dchip').textContent = dChip();
renderAll();
if (state.tab === 'plan' && todayIdx >= 0) {
  const r = slotRanges(DAYS[todayIdx]).findIndex(([a, b]) => now.min >= a && now.min < b);
  if (r >= 0) setTimeout(() => document.getElementById('slot-' + r)?.scrollIntoView({ block: 'start' }), 150);
}
</script>
